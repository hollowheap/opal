<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uniform spacing fixture</title>
    <style>
      body { margin: 0; padding: 0; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      h1, h2, p { margin: 16px; }
      section { padding: 16px; margin: 16px; border: 1px solid #1a1a1a; }
      a, button { min-width: 44px; min-height: 44px; padding: 16px; margin: 16px; }
      a:hover, button:hover { background: #f2f2f2; }
      a:focus-visible, button:focus-visible { outline: 2px solid #1a1a1a; }
      ::selection { background: #d0d0d0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Uniform spacing</h1>
      <section><h2>First</h2><p>First section copy.</p></section>
      <section><h2>Second</h2><p>Second section copy.</p></section>
      <section><h2>Third</h2><p>Third section copy.</p></section>
      <p><a href="#main">A link</a></p>
      <button type="button">A button</button>
    </main>
  </body>
</html>
