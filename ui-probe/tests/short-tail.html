<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Short last line fixture</title>
    <style>
      body { margin: 0; padding: 16px; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
      p { width: 180px; margin: 0 0 16px; }
      a, button { min-width: 44px; min-height: 44px; padding: 16px 20px; }
      a:hover, button:hover { background: #f2f2f2; }
      a:focus-visible, button:focus-visible { outline: 2px solid #1a1a1a; }
      ::selection { background: #d0d0d0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Short last line</h1>
      <p>This paragraph is deliberately wide enough to wrap but narrow enough to leave one short word at the end of the final line.</p>
      <p><a href="#main">A link</a></p>
    </main>
  </body>
</html>
