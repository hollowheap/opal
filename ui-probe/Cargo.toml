[package]
name = "ui-probe"
version = "0.1.0"
edition = "2021"
description = "Render a page in headless Chromium and emit UI evidence as JSON"
license = "MIT"

[dependencies]
anyhow = "1"
playwright-rs = { version = "0.20", default-features = false, features = ["rustls-tls-native-roots", "ring"] }
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
